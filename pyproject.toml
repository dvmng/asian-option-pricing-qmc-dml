[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compute-asian-options"
version = "0.2.0"
description = "Research code for Asian option pricing and hedging on compute capacity."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compute*", "compute_ml*", "compute_hedging*", "tfm_project*"]
